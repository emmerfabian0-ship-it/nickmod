name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: |
          set +e
          gradle build --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|What went wrong|Could not|Execution failed|Unsupported|not found|Plugin" -A2 build.log | head -30 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle-Fehler::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: nickmod-jar
          path: build/libs/nickmod-1.0.0.jar
